<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeCircle Thokoza - Login</title>
  <style>
    body { margin:0; font-family: Arial; background: #fff0f3; display:flex; justify-content:center; align-items:center; min-height:100vh; }
    .card { background:white; width:300px; padding:30px 20px; border-radius:20px; border:1.5px solid #000; text-align:center; box-shadow:0 4px 10px rgba(0,0,0,0.05); }
    .shield { color:#e68a9e; font-size:18px; }
    h2 { margin:10px 0 5px; }
    p.small { font-size:12px; color:#666; margin:0 0 20px; }
    label { display:block; text-align:left; font-size:12px; margin:12px 0 4px; font-weight:bold; }
    input { width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; background:#fdf6f6; box-sizing:border-box; }
    .btn { width:100%; background:black; color:white; padding:12px; border-radius:20px; border:none; margin-top:18px; font-weight:bold; cursor:pointer; }
    .links { font-size:10px; margin-top:10px; }
    .footer { font-size:9px; margin-top:15px; color:#888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield">🛡️ 1. LOGIN</div>
    <h2>🛡️ Log In</h2>
    <p class="small"><b>Welcome back</b><br>Sign in to continue to SafeCircle Thokoza</p>
    
    <label>Email</label>
    <input type="email" value="demo@thokoza.com">
    
    <label>Password</label>
    <input type="password" value="Demo1234">
    
    <button class="btn" onclick="window.location.href='home.html'">Log In</button>
    
    <div class="links">Forgot password? • Secure login</div>
    <div class="footer">Protecting women in your community • Version 1.0.2</div>
  </div>
  <div id="contactList"></div>
<script>
let myContacts = JSON.parse(localStorage.getItem('myContacts')) || [];
function addContact(){
 let name=document.getElementById('contactName').value;
 let phone=document.getElementById('contactPhone').value;
 if(name && phone){
   myContacts.push({name:name, phone:phone});
   localStorage.setItem('myContacts', JSON.stringify(myContacts));
   alert(name+" saved!");
   location.reload();
 }
}
function showContacts(){
 let list=document.getElementById('contactList');
 if(list){
  list.innerHTML = myContacts.map(c => "<p>👤 "+c.name+" - "+c.phone+"</p>").join('');
 }
}
showContacts();
</script>
</body>
</html>
