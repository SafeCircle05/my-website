<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#FDE8EC;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif}
.phone{width:340px;height:520px;background:white;border-radius:20px;padding:18px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}
.r19{background:#FF1744;color:white;font-size:10px;padding:5px 12px;border-radius:20px;margin-bottom:12px}
@keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,23,68,0.7)}70%{transform:scale(1.08);box-shadow:0 0 0 25px rgba(255,23,68,0)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,23,68,0)}}
.btn{width:180px;height:180px;background:#FF1744;color:white;border-radius:50%;border:none;font-size:19px;font-weight:bold;animation:pulse 1.8s infinite;cursor:pointer}
.small{font-size:11px;color:#666;margin-top:15px}
</style>
</head>
<body>
<div class="phone">
<span class="r19">R19/mo Family Circle Active</span>
<h4>🛡️ Home</h4>
<a href="sos-active.html" style="text-decoration:none"><button class="btn">EMERGENCY</button></a>
<div class="small">Press to alert your trusted circle instantly</div>
</div>
</body>
</html>
